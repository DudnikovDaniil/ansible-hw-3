---
- name: Install ClickHouse
  hosts: clickhouse
  become: true
  tasks:
    - name: Install dependencies
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: true

    - name: Add ClickHouse GPG key
      ansible.builtin.shell: |
        curl -fsSL 'https://packages.clickhouse.com/rpm/lts/repodata/repomd.xml.key' | gpg --dearmor | sudo tee /usr/share/keyrings/clickhouse-archive-keyring.gpg > /dev/null
      args:
        creates: /usr/share/keyrings/clickhouse-archive-keyring.gpg

    - name: Add ClickHouse repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/clickhouse-archive-keyring.gpg] https://packages.clickhouse.com/deb stable main"
        state: present
        update_cache: true

    - name: Install ClickHouse
      ansible.builtin.apt:
        name:
          - clickhouse-server
          - clickhouse-client
        state: present

    - name: Start ClickHouse
      ansible.builtin.systemd:
        name: clickhouse-server
        state: started
        enabled: true

- name: Install Vector
  hosts: vector
  become: true
  tasks:
    - name: Download Vector
      ansible.builtin.get_url:
        url: https://packages.timber.io/vector/0.33.1/vector-0.33.1-x86_64-unknown-linux-musl.tar.gz
        dest: /tmp/vector.tar.gz

    - name: Extract Vector
      ansible.builtin.unarchive:
        src: /tmp/vector.tar.gz
        dest: /tmp/
        remote_src: true

    - name: Install Vector binary
      ansible.builtin.copy:
        src: /tmp/vector-x86_64-unknown-linux-musl/bin/vector
        dest: /usr/local/bin/vector
        mode: '0755'
        remote_src: true

    - name: Create Vector config directory
      ansible.builtin.file:
        path: /etc/vector
        state: directory
        mode: '0755'

    - name: Copy Vector config
      ansible.builtin.copy:
        content: |
          [sources.dummy_logs]
          type = "demo_logs"
          format = "apache_common"

          [sinks.stdout]
          type = "console"
          inputs = ["dummy_logs"]
          encoding.codec = "json"
        dest: /etc/vector/vector.toml

- name: Install Lighthouse
  hosts: lighthouse
  become: true
  tasks:
    - name: Install Nginx and Git
      ansible.builtin.apt:
        name:
          - nginx
          - git
        state: present
        update_cache: true

    - name: Clone Lighthouse repository
      ansible.builtin.git:
        repo: https://github.com/VKCOM/lighthouse.git
        dest: /var/www/lighthouse
        version: master

    - name: Create Nginx config for Lighthouse
      ansible.builtin.template:
        src: lighthouse.conf.j2
        dest: /etc/nginx/sites-available/lighthouse
        mode: '0644'
      notify: reload nginx

    - name: Enable Lighthouse site
      ansible.builtin.file:
        src: /etc/nginx/sites-available/lighthouse
        dest: /etc/nginx/sites-enabled/lighthouse
        state: link

    - name: Remove default Nginx site
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent

  handlers:
    - name: reload nginx
      ansible.builtin.systemd:
        name: nginx
        state: reloaded
